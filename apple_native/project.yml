name: JARVISCompanionApps

options:
  bundleIdPrefix: org.grizzlymedicine.jarvis
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  transitivelyLinkDependencies: true

packages:
  JARVISCompanion:
    path: ../apple_companion

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "16"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T5AFHQ4L9C

targets:
  JARVISCompanionApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JARVISCompanionApp
    dependencies:
      - target: JARVISWatchApp
        embed: true
        link: false
      - package: JARVISCompanion
        product: JARVISCompanionCore
      - package: JARVISCompanion
        product: JARVISCompanionUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.phone
        PRODUCT_NAME: JARVIS
        INFOPLIST_FILE: JARVISCompanionApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: JARVISCompanionApp/JARVISCompanionApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: JARVIS AppStore Local ai.realjarvis.phone

  JARVISWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: JARVISWatchApp
    dependencies:
      - package: JARVISCompanion
        product: JARVISCompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.phone.watchkitapp
        PRODUCT_NAME: JARVIS Watch
        INFOPLIST_FILE: JARVISWatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: JARVISWatchApp/JARVISWatchApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: JARVIS AppStore HealthKit ai.realjarvis.phone.watchkitapp
