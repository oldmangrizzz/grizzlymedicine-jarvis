name: JARVISiOSCompanion

options:
  bundleIdPrefix: ai.realjarvis
  deploymentTarget:
    iOS: "17.0"
  transitivelyLinkDependencies: true

packages:
  JARVISWire:
    path: ../wire

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  JARVISiOSCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JARVISiOSCompanion
    dependencies:
      - package: JARVISWire
        product: JARVISWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.iphone.surface
        PRODUCT_NAME: JARVIS
        PRODUCT_MODULE_NAME: JARVISiOSCompanion
        INFOPLIST_FILE: JARVISiOSCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: JARVISiOSCompanion/JARVISiOSCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        VALID_ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ENABLE_TESTABILITY: YES
      configs:
        Debug:
          GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1 $(inherited)
  JARVISiOSCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/JARVISiOSCompanionTests
    dependencies:
      - target: JARVISiOSCompanion
      - package: JARVISWire
        product: JARVISWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.iphone.surface.tests
        INFOPLIST_FILE: Tests/JARVISiOSCompanionTests/Info.plist
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/JARVIS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/JARVIS
        BUNDLE_LOADER: $(TEST_HOST)
